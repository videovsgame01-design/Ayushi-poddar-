<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coffee Plan ☕</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    text-align:center;
    color:white;
}

.box{
    background:rgba(255,255,255,0.18);
    padding:30px;
    border-radius:25px;
    box-shadow:0 0 20px rgba(0,0,0,.25);
    max-width:380px;
    width:100%;
}

h1{
    font-size:32px;
}

p{
    font-size:19px;
    line-height:1.6;
}

/* YES / NO buttons */

.choice-area{
    position:relative;
    height:150px;
    margin-top:20px;
}

.choice-btn{
    padding:13px 28px;
    font-size:18px;
    border:none;
    border-radius:30px;
    color:white;
    cursor:pointer;
    position:absolute;
    top:50px;
}

#yesBtn{
    background:#25D366;
    left:15%;
}

#noBtn{
    background:#ff4081;
    right:15%;
    transition:0.2s;
}

/* Date page */

#datePage{
    display:none;
}

input{
    width:90%;
    padding:14px;
    border:none;
    border-radius:12px;
    font-size:17px;
    margin-top:10px;
}

.confirm-btn{
    padding:13px 24px;
    font-size:18px;
    border:none;
    border-radius:30px;
    background:#25D366;
    color:white;
    cursor:pointer;
    margin-top:20px;
}

button:hover{
    opacity:0.9;
}

.small{
    font-size:14px;
    margin-top:15px;
}

</style>
</head>

<body>

<div class="box">

    <!-- QUESTION PAGE -->

    <div id="questionPage">

        <h1>☕ Coffee Plan? ☕</h1>

        <p>
            Ek important question hai... 🥺❤️
            <br><br>
            Mere saath coffee pe chalogi? ☕😊
        </p>

        <div class="choice-area">

            <button
                id="yesBtn"
                class="choice-btn"
                onclick="showDatePage()">
                ❤️ YES
            </button>

            <button
                id="noBtn"
                class="choice-btn"
                onclick="moveNoButton()">
                😜 NO
            </button>

        </div>

        <p class="small">
            Hint: NO button thoda shy hai 😂
        </p>

    </div>


    <!-- DATE PAGE -->

    <div id="datePage">

        <h1>☕ Coffee Plan ☕</h1>

        <p>
            Yayyy! 😄❤️
            <br><br>
            Ek date choose karo 😊<br>
            Coffee plan ke liye 📅
        </p>

        <input type="date" id="coffeeDate">

        <br>

        <button
            class="confirm-btn"
            onclick="sendWhatsApp()">
            💚 Confirm Date 💚
        </button>

    </div>

</div>


<script>

/* --------------------------------
   BACK HANDLING
-------------------------------- */

history.replaceState(null, "", location.href);

window.addEventListener("popstate", function () {
    history.pushState(null, "", location.href);
});


/* --------------------------------
   NO BUTTON MOVEMENT
-------------------------------- */

function moveNoButton(){

    const button = document.getElementById("noBtn");
    const area = document.querySelector(".choice-area");

    const maxX = area.clientWidth - button.offsetWidth;
    const maxY = area.clientHeight - button.offsetHeight;

    const randomX = Math.floor(Math.random() * Math.max(maxX, 1));
    const randomY = Math.floor(Math.random() * Math.max(maxY, 1));

    button.style.left = randomX + "px";
    button.style.top = randomY + "px";
    button.style.right = "auto";
}


/* --------------------------------
   YES BUTTON
-------------------------------- */

function showDatePage(){

    document.getElementById("questionPage").style.display = "none";

    document.getElementById("datePage").style.display = "block";

}


/* --------------------------------
   WHATSAPP DATE
-------------------------------- */

function sendWhatsApp(){

    const date = document.getElementById("coffeeDate").value;

    if(!date){
        alert("Please select a date ❤️");
        return;
    }

    const formattedDate =
        new Date(date + "T00:00:00").toLocaleDateString("en-IN", {
            day: "numeric",
            month: "long",
            year: "numeric"
        });

    const message =
        `Hi Ayush ❤️\n\nCoffee plan ke liye maine ${formattedDate} choose kiya hai. ☕😊`;

    /*
      Yahan apna wahi WhatsApp number rakho
      jo tumhari existing coffee.html mein tha.
    */

    const phone = "919288056524";

    window.open(
        `https://wa.me/${phone}?text=${encodeURIComponent(message)}`,
        "_blank"
    );
}

</script>

</body>
</html>
