<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coffee Plan ☕</title>

<style>
body{
    margin:0;
    padding:20px;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    text-align:center;
    color:white;
}

.box{
    background:rgba(255,255,255,0.18);
    padding:30px;
    border-radius:25px;
    box-shadow:0 0 20px rgba(0,0,0,.25);
    max-width:380px;
    width:100%;
}

h1{
    font-size:32px;
}

p{
    font-size:19px;
    line-height:1.6;
}

input{
    width:90%;
    padding:14px;
    border:none;
    border-radius:12px;
    font-size:17px;
    margin-top:10px;
}

button{
    padding:13px 24px;
    font-size:18px;
    border:none;
    border-radius:30px;
    background:#25D366;
    color:white;
    cursor:pointer;
    margin-top:20px;
}

button:hover{
    opacity:0.9;
}
</style>
</head>

<body>

<div class="box">

    <h1>☕ Coffee Plan ☕</h1>

    <p>
        Ek date choose karo 😊<br>
        Coffee plan ke liye 📅
        tum free ho tab  🥺
        
    </p>

    <input type="date" id="coffeeDate">

    <br>

    <button onclick="sendWhatsApp()">
        💚 Confirm Date 💚
     </button>

</div>

<script>

function sendWhatsApp(){

    const date = document.getElementById("coffeeDate").value;

    if(!date){
        alert("Please select a date ❤️");
        return;
    }

    const formattedDate = new Date(date + "T00:00:00").toLocaleDateString("en-IN", {
        day: "numeric",
        month: "long",
        year: "numeric"
    });

    const message =
        `Hi Ayush ❤️\n\nCoffee plan ke liye maine ${formattedDate} choose kiya hai. ☕😊`;

    // Yahan apna wahi WhatsApp number paste karo
    // Country code ke saath, + ya spaces ke bina
    const phone = "9288056524";

    window.open(
        `https://wa.me/${phone}?text=${encodeURIComponent(message)}`,
        "_blank"
    );
}

</script>

</body>
</html>
