<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="stylesheet" href="font.css">  
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coffee Plan ☕</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    min-height:100vh;

    background:linear-gradient(135deg,#ff9a9e,#fad0c4);

    font-family:Arial,sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;
    color:white;

    overflow-x:hidden;
}

.box{
    background:rgba(255,255,255,0.18);

    padding:30px;

    border-radius:25px;

    box-shadow:0 0 20px rgba(0,0,0,.25);

    max-width:380px;
    width:100%;
}

h1{
    font-size:32px;
}

p{
    font-size:19px;
    line-height:1.6;
}


/* =========================
   QUESTION PAGE
========================= */

.choice-area{
    position:relative;

    width:100%;
    height:180px;

    margin-top:20px;
}

.choice-btn{
    padding:14px 28px;

    font-size:18px;

    border:none;
    border-radius:30px;

    color:white;

    cursor:pointer;

    position:absolute;

    transition:
        transform 0.4s ease,
        left 0.2s ease,
        top 0.2s ease;
}

#yesBtn{
    background:#25D366;

    left:15%;
    top:55px;

    z-index:10;

    transform-origin:center;
}

#noBtn{
    background:#ff4081;

    right:15%;
    top:55px;

    z-index:20;
}

.small{
    font-size:14px;
    margin-top:10px;
}


/* =========================
   DATE PAGE
========================= */

#datePage{
    display:none;
}

input{
    width:90%;

    padding:14px;

    border:none;
    border-radius:12px;

    font-size:17px;

    margin-top:10px;
}

.confirm-btn{
    padding:13px 24px;

    font-size:18px;

    border:none;
    border-radius:30px;

    background:#25D366;

    color:white;

    cursor:pointer;

    margin-top:20px;
}

button:hover{
    opacity:0.9;
}


/* =========================
   FULL SCREEN YES
========================= */

#yesBtn.fullscreen{

    position:fixed;

    left:0;
    top:0;

    width:100vw;
    height:100vh;

    padding:0;

    margin:0;

    border-radius:0;

    font-size:45px;

    transform:scale(1);

    z-index:9999;

    display:flex;

    justify-content:center;

    align-items:center;
}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    .box{
        padding:25px 20px;
    }

    h1{
        font-size:28px;
    }

    p{
        font-size:18px;
    }

    .choice-area{
        height:200px;
    }

}

</style>
</head>


<body>


<div class="box">


    <!-- =====================
         QUESTION PAGE
    ====================== -->

    <div id="questionPage">

        <h1>
            ☕ Coffee Plan? ☕
        </h1>

        <p>

            Ek important question hai... 🥺❤️

            <br><br>

            Mere saath coffee pe chalogi? ☕😊

        </p>


        <div class="choice-area">


            <button
                id="yesBtn"
                class="choice-btn"
                onclick="showDatePage()">

                ❤️ YES ❤️

            </button>


            <button
                id="noBtn"
                class="choice-btn"
                onclick="moveNoButton()">

                ☹️ NO

            </button>


        </div>


        <p class="small">

            yes ker do ek bar 🙃

        </p>

    </div>



    <!-- =====================
         DATE PAGE
    ====================== -->

    <div id="datePage">


        <h1>
            ☕ Coffee Plan ☕
        </h1>


        <p>

            Yayyy! 😄❤️

            <br><br>

            Ab ek date choose karo 😊

            <br>

            Coffee plan ke liye 📅

        </p>


        <input
            type="date"
            id="coffeeDate"
        >


        <br>


        <button
            class="confirm-btn"
            onclick="sendWhatsApp()">

            💚 Confirm Date 💚

        </button>


    </div>


</div>



<script>


/* =========================
   BACK HANDLING
========================= */

history.replaceState(null, "", location.href);

window.addEventListener("popstate", function(){

    history.pushState(null, "", location.href);

});



/* =========================
   NO BUTTON
========================= */

let noClicks = 0;


function moveNoButton(){

    noClicks++;


    const noButton =
        document.getElementById("noBtn");

    const yesButton =
        document.getElementById("yesBtn");

    const area =
        document.querySelector(".choice-area");


    /* =====================
       NO BUTTON BHAAGEGA
    ====================== */

    const maxX =
        area.clientWidth - noButton.offsetWidth;

    const maxY =
        area.clientHeight - noButton.offsetHeight;


    const randomX =
        Math.floor(
            Math.random() * Math.max(maxX,1)
        );


    const randomY =
        Math.floor(
            Math.random() * Math.max(maxY,1)
        );


    noButton.style.left =
        randomX + "px";

    noButton.style.top =
        randomY + "px";

    noButton.style.right =
        "auto";



    /* =====================
       YES BUTTON SIZE
    ====================== */

    if(noClicks === 1){

        yesButton.style.transform =
            "scale(1.3)";

    }


    else if(noClicks === 2){

        yesButton.style.transform =
            "scale(1.7)";

    }


    else if(noClicks === 3){

        yesButton.style.transform =
            "scale(2.3)";

    }


    else if(noClicks === 4){

        yesButton.style.transform =
            "scale(3.5)";

    }


    /* =====================
       5TH NO
       FULL SCREEN YES
    ====================== */

    else if(noClicks >= 5){

        yesButton.classList.add("fullscreen");

        yesButton.innerHTML =
            "❤️ YES ❤️";

    }

}



/* =========================
   YES BUTTON
========================= */

function showDatePage(){

    document.getElementById("questionPage")
        .style.display = "none";


    document.getElementById("datePage")
        .style.display = "block";

}



/* =========================
   WHATSAPP
========================= */

function sendWhatsApp(){

    const date =
        document.getElementById("coffeeDate").value;


    if(!date){

        alert("Please select a date ❤️");

        return;

    }


    const formattedDate =
        new Date(date + "T00:00:00")
        .toLocaleDateString("en-IN", {

            day:"numeric",
            month:"long",
            year:"numeric"

        });


    const message =
        `Hi Ayush ❤️\n\nCoffee plan ke liye maine ${formattedDate} choose kiya hai. ☕😊`;


    /*
       IMPORTANT:
       Yahan apna existing WhatsApp number
       country code ke saath rakho.
    */

    const phone =
        "919288056524";


    window.open(

        `https://wa.me/${phone}?text=${encodeURIComponent(message)}`,

        "_blank"

    );

}

</script>


</body>
</html>
