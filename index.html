<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Ayushi ❤️</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

#passwordScreen{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:25px;
}

#passwordScreen h1{
    margin-bottom:15px;
}

#passwordScreen h2{
    margin-bottom:15px;
}

#passwordInput{
    padding:13px 18px;
    border:none;
    outline:none;
    border-radius:25px;
    font-size:17px;
    text-align:center;
}

#passwordBtn{
    margin-top:15px;
    padding:13px 28px;
    border:none;
    border-radius:25px;
    background:#ff4081;
    color:white;
    font-size:17px;
    cursor:pointer;
}

#passwordError{
    margin-top:10px;
}

</style>

</head>

<body>

<!-- PASSWORD -->

<div id="passwordScreen">

    <h1>🔐 Secret Surprise 🔐</h1>

    <h2>Enter Password ❤️</h2>

    <input
        type="password"
        id="passwordInput"
        placeholder="Enter Password"
    >

    <br>

    <button id="passwordBtn">
        Unlock 🎁
    </button>

    <p id="passwordError"></p>

</div>


<!-- LOADER -->

<div id="loader" style="display:none;">

    <h1>🎁 A Special Surprise 🎁</h1>

    <h2>For</h2>

    <h1>Ayushi Poddar ❤️</h1>

    <button id="startBtn">
        Open Surprise 🎉
    </button>

</div>


<!-- MAIN -->

<div id="main" style="display:none;">

    <h1 class="title">
        🎂 Happy Birthday 🎂
    </h1>

    <h2 class="name">
        AYUSHI PODDAR
    </h2>


    <div class="swipe-box">
        <div class="swipe-area">
            <div class="swipe-hint">👆 Swipe</div>
            <img src="IMG-20260308-WA0001.jpg" class="hidden-content">
        </div>
    </div>


    <div class="swipe-box">
        <div class="swipe-area">
            <div class="swipe-hint">👆 Swipe</div>
            <img src="photo 1.png" class="hidden-content">
        </div>
    </div>


    <div class="swipe-box">
        <div class="swipe-area">
            <div class="swipe-hint">👆 Swipe</div>
            <img src="photo 2.png" class="hidden-content">
        </div>
    </div>


    <div class="swipe-box">
        <div class="swipe-area">
            <div class="swipe-hint">👆 Swipe</div>
            <img src="photo 3.jpg" class="hidden-content">
        </div>
    </div>


    <div class="swipe-box">
        <div class="swipe-area">
            <div class="swipe-hint">👆 Swipe</div>
            <img src="photo 4.jpg" class="hidden-content">
        </div>
    </div>

</div>


<script src="script.js"></script>

</body>
</html>
